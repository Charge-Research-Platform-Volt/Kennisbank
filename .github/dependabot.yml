# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates come as separate PRs, since those are the ones that can break things.
# Dockerfile base images use floating tags (sdk:10.0, node:24-alpine, ...) that already pick up
# patches on every build, so they're not managed here; runtime major bumps are done deliberately.
version: 2

updates:
  - package-ecosystem: nuget
    directories: ["/backend", "/backend.Tests"]
    schedule: { interval: weekly, day: monday }
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /webscrape-service
    schedule: { interval: weekly, day: monday }
    groups:
      webscrape-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

name: Release webscrape

on:
  push:
    tags: ['webscrape-v*.*.*']

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    with:
      run_all: true
    permissions:
      contents: read
      pull-requests: read

  webscrape:
    name: Webscrape
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/knowledgebank-webscrape
          tags: |
            type=match,pattern=webscrape-v(\d+\.\d+\.\d+),group=1
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./webscrape-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=webscrape
          cache-to: type=gha,scope=webscrape,mode=max

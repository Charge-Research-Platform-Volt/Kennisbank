stages:
  - build
  - test
  - cleanup

variables:
  COMPOSE_PROJECT_NAME: ${CI_PROJECT_NAME}-${CI_PIPELINE_ID}
  COMPOSE: docker-compose --env-file .gitlab-ci.env -f docker-compose.yml -f docker-compose.ci.yml
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Define default image and service
default:
  image: docker:latest
  services:
    - docker:dind

# Define reusable templates
.setup_environment: &setup_environment
  - docker info
  - apk add --no-cache docker-compose py3-pip
  - docker-compose version
  - docker system prune -f || true

.cleanup_environment: &cleanup_environment
  - docker-compose down -v --remove-orphans || true

.release_ports: &release_ports
  - docker ps | grep 5432 && docker stop $(docker ps | grep 5432 | awk '{print $1}') || true
  - docker ps | grep 10000 && docker stop $(docker ps | grep 10000 | awk '{print $1}') || true
  - docker ps | grep 8080 && docker stop $(docker ps | grep 8080 | awk '{print $1}') || true
  - docker ps | grep 8081 && docker stop $(docker ps | grep 8081 | awk '{print $1}') || true
  - docker ps | grep 3000 && docker stop $(docker ps | grep 3000 | awk '{print $1}') || true
  - docker ps | grep 3001 && docker stop $(docker ps | grep 3001 | awk '{print $1}') || true

.wait_for_database: &wait_for_database
  - |
    for i in $(seq 1 30); do
      if docker-compose exec -T database pg_isready -U postgres; then
        echo "Database is ready!"
        break
      fi
      echo "Waiting for database... $i/30"
      sleep 2
      if [ $i -eq 30 ]; then
        echo "Database timeout after 60 seconds"
        exit 1
      fi
    done

.wait_for_backend: &wait_for_backend
  - |
    for i in $(seq 1 30); do
      if docker-compose exec -T backend curl -sf http://localhost:8080/status > /dev/null 2>&1; then
        echo "Backend is ready!"
        break
      fi
      echo "Waiting for backend... $i/30"
      sleep 5
      if [ $i -eq 30 ]; then
        echo "Backend timeout after 150 seconds"
        exit 1
      fi
    done

.start_backend: &start_backend
  - ${COMPOSE} up -d database storage
  - *wait_for_database
  - ${COMPOSE} up -d backend
  - *wait_for_backend

.cleanup: &cleanup
  - docker-compose down -v || true
  
# Build all services in the Docker Compose stack
build:
  stage: build
  before_script:
    - *setup_environment
    - *cleanup_environment
  script:
    - ${COMPOSE} build --no-cache
  artifacts:
    expire_in: 1 hour

# Test backend using NUnit
test-backend:
  stage: test
  needs: ["build"]
  before_script:
    - *setup_environment
  script:
    - *start_backend
    - NODE_ENV=development ${COMPOSE} run --rm backend sh -c 'dotnet build && dotnet test --logger:"console;verbosity=detailed"'
  after_script:
    - *cleanup

# Test frontend using VTest
test-frontend:
  stage: test
  needs: ["build"]
  before_script:
    - *setup_environment
  script:
    # Start the backend service as frontend tests might need it
    - *start_backend
    # Run frontend tests
    - NODE_ENV=development ${COMPOSE} run --rm frontend sh -c "npm install && npm test -- --run"
  after_script:
    - *cleanup

# Cleanup job that only targets containers on the ci_network
final-cleanup:
  stage: cleanup
  when: always
  script:
    # Ensure the docker-compose processes are stopped
    - docker-compose -p ${COMPOSE_PROJECT_NAME} down -v --remove-orphans || true
    
    # Find and stop only containers connected to ci_network
    - |
      echo "Finding containers connected to ci_network..."
      
      # This command finds all containers connected to the ci_network
      CONTAINERS_ON_NETWORK=$(docker network inspect ci_network -f '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null || echo "")
      
      if [ -n "$CONTAINERS_ON_NETWORK" ]; then
        echo "Stopping containers on ci_network: $CONTAINERS_ON_NETWORK"
        for container in $CONTAINERS_ON_NETWORK; do
          docker stop $container || true
          docker rm $container || true
          echo "Stopped and removed: $container"
        done
      else
        echo "No containers found on ci_network"
      fi
    
    # Remove the network itself if it exists
    - |
      if docker network ls | grep -q "ci_network"; then
        echo "Removing ci_network..."
        docker network rm ci_network || true
      else
        echo "ci_network does not exist"
      fi
    
    # Clean up other resources that might be left by the CI process
    - |
      echo "Cleaning up dangling resources..."
      docker container prune -f
      docker image prune -f
      docker volume prune -f
      docker builder prune -f
    
    - echo "Cleanup completed - released all ports on ci_network"


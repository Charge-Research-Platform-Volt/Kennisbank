x-jsbase: &jsbase
  build:
    no_cache: true
  environment:
    - WATCHPACK_POLLING=true

services:
  # Set up temporary folders for storages
  database:
    tmpfs:
      - /data

  storage:
    tmpfs:
      - /data

  # Uncertain what these are for, but these were differences from prod compose
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/status || exit 1"]

  frontend:
    <<: *jsbase

  website:
    <<: *jsbase


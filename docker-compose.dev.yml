x-jsbase: &jsbase
  build:
    no_cache: true
  environment:
    - WATCHPACK_POLLING=true

services:
  # Set up temporary folders for storages
  database:
    tmpfs:
      - /data

  storage:
    tmpfs:
      - /data

  # For our dev environment we need to extend all coded services with volumes for hot reload
  backend:
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
      - ./testdata:/app/testdata

  # Additionally, for the java script end, we have to turn on WATCHPACK_POLLING
  # and turn of the cache, because otherwise hot reload does not work on windows
  frontend:
    <<: *jsbase
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  
  website:
    <<: *jsbase
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next


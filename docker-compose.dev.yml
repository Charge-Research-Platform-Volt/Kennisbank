networks:
  dev_network:
    name: dev_network
    driver: bridge

x-network: &network
  networks:
    - dev_network

# Target to use for building the images
x-target: &target
  target: development

# For the java script end, we have to turn on WATCHPACK_POLLING and turn of the cache,
# otherwise hot reload does not work on windows
# Base args for the js code bases
x-jsbase: &jsbase
  build:
    <<: *target
    no_cache: true
  environment:
    - WATCHPACK_POLLING=true
  <<: *network

services:
  # Set up temporary folders for storages
  database:
    tmpfs:
      - /var/lib/postgresql/data
    <<: *network

  storage:
    tmpfs:
      - /data
    <<: *network

  # For our dev environment we need to extend all coded services with volumes for hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *target
    env_file:
      - path: .env.development
        required: true
    environment:
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=true # Also restart for outside changes
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
      - ./testdata:/app/testdata
    command: dotnet watch --project backend.csproj run --urls http://+:8080 # Use dotnet watch for hot reload, PORT is set in the dockerfile
    <<: *network

  frontend:
    <<: *jsbase
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

  # Start website after backend
  # website:
  #   <<: *jsbase
  #   volumes:
  #     - ./website:/app
  #     - /app/node_modules
  #     - /app/.next

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - dev_network
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:6333 || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   environment:
  #     - OLLAMA_DEBUG=1
  #   ports:
  #     - 11434:11434
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   networks:
  #     - dev_network
  #   entrypoint: ["/bin/sh", "-c"]
  #   command: >
  #     "ollama serve &
  #      sleep 10 &&
  #      ollama pull gemma3:4b &&
  #      ollama pull paraphrase-multilingual &&
  #      tail -f /dev/null"

configs:
  qdrant_config:
    content: |
      log_level: INFO


networks:
  dev_network:
    name: dev_network
    driver: bridge

services:
  # Start database
  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Start storage
  storage:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    tmpfs:
      - /data
    networks:
      - dev_network

  # Start backend after database and storage
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:8080"
    env_file:
      - path: .env.development
        required: true
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
      - ./testdata:/app/testdata
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 150s

  # Start frontend after backend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      no_cache: true
    ports:
      - "3000:3000"
    environment:
      - API_URL=${API_URL}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dev_network

  # Start website after backend
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: development
      no_cache: true
    ports:
      - "3001:3001"
    environment:
      - API_URL=${API_URL}
      - HELP_URL=${HELP_URL}
      - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dev_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - dev_network

  # ollama:
  #   image: ollama/ollama:latest

# For our dev environment we need to extend all coded services with volumes for hot reload

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
      - ./testdata:/app/testdata

  # Additionally, for the java script end, we have to turn on WATCHPACK_POLLING
  # and turn of the cache, because otherwise hot reload does not work on windows
  frontend:
    build:
      no_cache: true
    environment:
      - API_URL=${API_URL}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  
  website:
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next


services:
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - my_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - database
    networks:
      - my_network

  backend:
    build:
      context: .
      dockerfile: /backend/Dockerfile
      target: test
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=database;Port=5432;Username=postgres;Password=postgres;Database=postgres;Include Error Detail=true
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    depends_on:
      - database
    networks:
      - my_network

  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./database:/var/lib/postgresql/data
      # - database_data:/var/lib/postgresql/data
    networks:
      - my_network

networks:
  my_network:
    name: my_network
    driver: bridge

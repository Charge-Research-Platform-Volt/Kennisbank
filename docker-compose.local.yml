# Local development - infrastructure services only
# Run backend and frontend natively for faster development

services:
  # PostgreSQL Database
  database:
    image: pgvector/pgvector:pg16
    container_name: knowledgebank-db-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Azure Storage Emulator
  storage:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: knowledgebank-storage-local
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data_local:/data
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledgebank-qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_local:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data_local:
  azurite_data_local:
  qdrant_data_local:


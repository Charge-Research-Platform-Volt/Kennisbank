# Local development - infrastructure services only
# Run backend and frontend natively for faster development

services:
  # PostgreSQL Database
  database:
    image: pgvector/pgvector:pg16
    container_name: knowledgebank-db-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible Object Storage (MinIO)
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: knowledgebank-storage-local
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_local:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    container_name: knowledgebank-meilisearch-local
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKeyForLocalDevOnly
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data_local:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data_local:
  minio_data_local:
  meilisearch_data_local:
networks:
  prod_network:
    name: prod_network
    driver: bridge

# Define base aditions to all services
# Root access
# Automatic restarts
# Logging
# Network
x-base: &base
  user: root
  privileged: true
  networks:
    - prod_network
  restart: unless-stopped
  logging:
    driver: "local"
    options:
      max-size: "10m"
      max-file: "5"

# Default for our images
x-imagebase: &imagebase
  build:
    target: production
  <<: *base

services:
  database:
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent volume
    <<: *base
    ports:
      - 9004:5432

  storage:
    volumes:
      - storage_data:/data # Persistent volume
    <<: *base
    ports:
      - 9003:10000

  backend:
    <<: *imagebase
    environment:
      HOST_URL: ${FROTEND_DOMAIN:-http://localhost:${FRONTEND_PORT:-9000}} # Overwrite with frontend port default as 9000
    env_file:
      - path: .env.development
        required: true
    healthcheck: # Slightly modify health check
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 9002:8080

  frontend:
    user: root
    privileged: true
    build:
      target: production
      args:
        API_URL: ${API_URL:-http://backend:8080} # Prod pre-builds the website, so it needs the backend URL as a build arg
    <<: *base
    environment:
      - HELP_URL=${HELP_URL:-http://localhost:${WEBSITE_PORT:-9001}} # Overwrite with website port default as 9001
    ports:
      - ${FRONTEND_PORT:-9000}:3000

  # website:
  #   <<: *imagebase
  #   ports:
  #     - ${WEBSITE_PORT:-9001}:3001

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - prod_network

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  postgres_data: # Persistent volume for database
  storage_data: # Persistent volume for storage


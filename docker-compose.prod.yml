services:
  # Production database
  database:
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production storage
  storage:
    volumes:
      - storage_data:/data  # Persistent volume
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production backend
  backend:
    healthcheck:
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production frontend
  frontend:
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
  
  # Production website
  website:
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:  # Persistent volume for database
  storage_data:   # Persistent volume for storage


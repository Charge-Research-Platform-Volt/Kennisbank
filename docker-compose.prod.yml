networks:
  prod_network:
    name: prod_network
    driver: bridge

services:
  # Production database with persistent volume
  database:
    user: root
    privileged: true
    image: postgres:latest
    ports:
      - "9004:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}  # Use env var with fallback
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume
    networks:
      - prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production storage
  storage:
    user: root
    privileged: true
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "9003:10000"
    volumes:
      - storage_data:/data  # Persistent volume
    networks:
      - prod_network
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production backend
  backend:
    user: root
    privileged: true
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production  # Use production target
    ports:
      - "9002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CONNECTION_STRING=Host=database;Port=5432;Username=postgres;Password=${DB_PASSWORD:-postgres};Database=postgres;
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://storage:10000/devstoreaccount1;
      - HOST_URL=https://ohmega.science.uu.nl
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - prod_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

  # Production frontend
  frontend:
    user: root
    privileged: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production  # Use production target
      args: 
        API_URL: ${API_URL}
    ports:
      - "9000:3000"
    environment:
      - API_URL=${API_URL}
      - HELP_URL=${HELP_URL}
      - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prod_network
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
  
  # Production website
  website:
    user: root
    privileged: true
    build:
      context: ./website
      dockerfile: Dockerfile
      target: production  # Use production target
    ports:
      - "9001:3001"
    environment:
      - API_URL=${API_URL}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prod_network
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:  # Persistent volume for database
  storage_data:   # Persistent volume for storage


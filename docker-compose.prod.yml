networks:
  prod_network:
    name: prod_network
    driver: bridge

# Define base aditions to all services
# Root access
# Automatic restarts
# Logging
# Network
x-base: &base
  user: root
  privileged: true
  restart: unless-stopped
  logging:
    driver: "local"
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - prod_network

# Default for our images
x-imagebase: &imagebase
  build:
    target: production
  <<: *base

services:
  database:
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume
    <<: *base

  storage:
    volumes:
      - storage_data:/data  # Persistent volume
    <<: *base

  backend:
    <<: *imagebase
    healthcheck: # Slightly modify health check
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    <<: *imagebase
  
  website:
    <<: *imagebase

volumes:
  postgres_data:  # Persistent volume for database
  storage_data:   # Persistent volume for storage


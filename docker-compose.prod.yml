# Production deployment - all services in Docker
# Use this for Azure Container Instances or production environments

services:
  # PostgreSQL Database
  database:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - HOST_URL=${HOST_URL:-http://localhost:3000}
      - DATABASE_CONNECTION_STRING=Host=database;Port=5432;Username=postgres;Password=postgres;Database=postgres;Include Error Detail=false
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_USE_SSL=${S3_USE_SSL}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_TLS_PORT=${EMAIL_TLS_PORT:-587}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-KnowledgeBank}
      - OwnerUser__Email=${OwnerUser__Email}
      - OwnerUser__Password=${OwnerUser__Password}
      - OwnerUser__FirstName=${OwnerUser__FirstName:-Owner}
      - OwnerUser__LastName=${OwnerUser__LastName:-User}
      - DOCUMENT_INTELLIGENCE_CLIENT_ENDPOINT=${DOCUMENT_INTELLIGENCE_CLIENT_ENDPOINT}
      - DOCUMENT_INTELLIGENCE_CLIENT_API_KEY=${DOCUMENT_INTELLIGENCE_CLIENT_API_KEY}
      - CHAT_DEPLOYMENT_NAME=${CHAT_DEPLOYMENT_NAME:-gpt-4o-mini}
      - AZURE_OPENAI_CLIENT_ENDPOINT=${AZURE_OPENAI_CLIENT_ENDPOINT}
      - AZURE_OPENAI_CLIENT_API_KEY=${AZURE_OPENAI_CLIENT_API_KEY}
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-embed-v-4-0}
      - EMBEDDINGS_CLIENT_ENDPOINT=${EMBEDDINGS_CLIENT_ENDPOINT}
      - EMBEDDINGS_CLIENT_API_KEY=${EMBEDDINGS_CLIENT_API_KEY}
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_URL=http://backend:8080
      - HELP_URL=${HELP_URL}
      - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE:-Europe/Berlin}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  azurite_data:
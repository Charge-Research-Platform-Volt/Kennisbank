networks:
  prod_network:
    name: prod_network
    driver: bridge

# Define base aditions to all services
# Root access
# Automatic restarts
# Logging
# Network
x-base: &base
  user: root
  privileged: true
  networks:
    - prod_network
  restart: unless-stopped
  logging:
    driver: "local"
    options:
      max-size: "10m"
      max-file: "5"

# Default for our images
x-imagebase: &imagebase
  build:
    target: production
  <<: *base

services:
  database:
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume
    <<: *base
    ports:
      - 9004:5432

  storage:
    volumes:
      - storage_data:/data  # Persistent volume
    <<: *base
    ports:
      - 9003:10000

  backend:
    <<: *imagebase
    healthcheck: # Slightly modify health check
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - 9002:8080

  frontend:
    build:
      target: production
      args:
        API_URL: ${API_URL:-http://backend:8080} # Prod pre-builds the website, so it needs the backend URL as a build arg
    <<: *base
    ports: 
      - ${FRONTEND_PORT:-9000}:3000
  
  website:
    <<: *imagebase
    ports:
      - ${WEBSITE_PORT:-9001}:3001

volumes:
  postgres_data:  # Persistent volume for database
  storage_data:   # Persistent volume for storage

